# Réglages du projet Kikina @ RIITM. Rien n'est en dur dans le code.

[sortie]
largeur = 14446      # à confirmer avec le technicien (14446 ou 14573)
hauteur = 760
fps = 30
scale = 1.0          # 0.5 = développer à demi-résolution
nom_ndi = "KIKINA"

[assets]
mire = "assets/mire_club_immersif_14446x760.jpg"

# ---------------------------------------------------------------------------
# La matière (étape 2). Tout ce bloc se recharge à chaud : on enregistre le
# fichier, l'image change. Seul `particules` demande de relancer le programme.
[matiere]
particules = 1200000
reglage_depart = "musique" # musique (la marée suit le son), calme, moyen ou dense
transition_s = 6           # durée du passage d'un réglage à l'autre
vie_s = [8, 25]            # chaque grain vit entre 8 et 25 s puis renaît ailleurs, en fondu
taille_px = 2.5            # diamètre moyen d'un grain
grain_px = 2.5             # taille du grain de l'image (jamais sous 2 : NDI l'efface)
grain_ips = 12             # le grain change 12 fois par seconde
grain_force = 0.25         # grain dans la matière (0 = lisse)
plancher = 0.03            # jamais de noir pur : 0.02 à 0.04
voile_echelle = 0.8        # taille des grandes masses (plus petit = masses plus larges)
voile_vitesse = 0.02       # lenteur de la respiration des masses
courant_echelle = 1.5      # taille des tourbillons
courant_evolution = 0.03   # vitesse à laquelle les tourbillons se déforment
densite = 0.7              # part des grains allumés (0 à 1), la même à tous les niveaux

# Le repos et l'agitation. Vitesses en hauteurs de bandeau par seconde (0.01 = 7,6 px/s).
repos_hauteur = 0.78       # où la matière se dépose au calme (0 = haut du mur, 1 = bas)
repos_force = 0.08         # force de l'attraction vers cette hauteur
repos_etalement = 0.35     # épaisseur de la nappe au repos (1 = tout le mur)
turbulence_repos = 0.006   # vitesse des tourbillons au calme
turbulence_eveil = 0.05    # vitesse des tourbillons à l'éveil maximal
remous_force = 0.16        # remous fins et vifs à l'agitation maximale
soulevement = 0.14         # vitesse de montée de la matière là où quelqu'un bouge

# L'agitation locale (à l'étape 3 : les webcams ; pour l'instant : la souris dans l'aperçu).
agitation_rayon_px = 900   # rayon de l'agitation autour d'un visiteur
agitation_montee_s = 0.35  # temps pour que l'agitation s'installe
agitation_retombee_s = 2.5 # temps pour qu'elle retombe



# Les 3 niveaux d'éveil global (ce que fera la musique). Touches C, M, D dans l'aperçu.
[matiere.calme]
eveil = 0.0                # 0 = la matière se dépose, 1 = elle est partout et s'agite
exposition = 0.8           # luminosité de la matière
brume = 0.03               # lueur diffuse dans les masses
voile_plein = 0.5          # part du mur occupée par les masses (0 = presque vide, 1 = plein)
voile_contraste = 0.9      # 1 = masses et vides marqués, 0 = uniforme
voile_filaments = 0.8      # 1 = masses déchirées en filaments, 0 = masses pleines

[matiere.moyen]
eveil = 0.5
exposition = 0.9
brume = 0.06
voile_plein = 0.65
voile_contraste = 0.85
voile_filaments = 0.5

[matiere.dense]
eveil = 1.0
exposition = 1.0
brume = 0.10
voile_plein = 0.85
voile_contraste = 0.7
voile_filaments = 0.25

# ---------------------------------------------------------------------------
# Les entrées (étape 3). Changer ce bloc demande de relancer le programme.
[entrees]
simulateur = true          # true : le son vient de son_test ; false : de l'entrée audio ci-dessous
son_test = "assets/test.wav"
audio_entree = ""          # une partie du nom de l'entrée audio en mode réel (vide = entrée par défaut)
osc_port = 7000            # à confirmer avec Arthur

# La musique. Se recharge à chaud. Durées = temps pour faire 95 % du chemin.
[musique]
volume_calme_db = -28      # volume mesuré qui vaut "calme" (lire la console)
volume_dense_db = -14      # volume mesuré qui vaut "dense"
maree_s = 2                # lissage de la marée (calme <-> dense)
accents_s = 0.5            # lissage des graves et de la brillance
graves_force = 0.15        # combien les graves font gonfler les masses (0 = coupé)
brillance_force = 0.4      # combien un son clair fait scintiller les grains fins (0 = coupé)
brillance_hz = [120, 300]  # brillance (lire la console) qui vaut "sombre", et "clair". Kikinator : 100 à 250 Hz
notes_saut_db = 4          # une note doit dépasser de 4 dB ce qu'on entendait juste avant (plus haut = moins de notes)
onde_rayon_px = 450        # rayon final de l'anneau d'une note forte (une note faible : environ la moitié)
onde_duree_s = 3           # vie d'une onde
onde_largeur = 0.07        # épaisseur du front, en hauteurs de bandeau
onde_poussee = 0.4         # force avec laquelle le front pousse la matière (0 = coupé)
onde_eclat = 2.0           # lumière en plus sur le front (0 = coupé)
octaves = [2.5, 5.5]       # octave qui va en bas du mur, octave qui va en haut (4 = do à 262 Hz)

# Les zones : plage de x de chaque zone, en px sur la largeur de référence 14446.
# Zone N = mur N : un atelier par mur (décidé le 23/09).
[zones]
plages = [[0, 5186], [5186, 7321], [7321, 12311], [12311, 14446]]
presence_force = 0.25      # agitation d'une présence immobile (le mouvement va jusqu'à 1)
presence_s = 1             # lissage de la présence
pas_x = [2450, 2700, 2950] # atelier Accueil : où naît l'anneau de chaque pas sur le bandeau (px, largeur de référence 14446). À caler sur place
pas_y = 0.8                # hauteur de ces anneaux (0 = haut du mur, 1 = bas)

# ---------------------------------------------------------------------------
# Les titres des ateliers et les cards (étape 5). Se recharge à chaud.
# Chaque mur a son dossier assets/cards/murN/ : titre.png (toujours affiché) et ses cards (les autres PNG).
# Une card est une colonne sombre qui coupe le mur sur presque toute sa hauteur, son texte en haut.
[cartes]
apparition_s = 4           # la matière se condense pour former la card
affichage_s = 18           # la card est lisible (vie totale : 4 + 18 + 4 = 26 s)
dissolution_s = 4          # elle se dissout
pause_s = 8                # matière seule entre deux cards d'un même mur
attente_s = 2              # délai entre l'arrivée d'un groupe dans la zone et sa première card
presence_seuil = 0.5       # présence (0 à 1) à partir de laquelle un groupe est "là"
titre_lumiere = 0.7        # luminosité du titre de l'atelier (1 = comme les cards)
haut_px = 40               # distance entre le haut du mur et le titre de l'atelier
ecart_px = 40              # la colonne s'arrête à 40 px du haut et du bas du mur (elle ne le coupe pas en entier)
interieur_px = 64          # marge entre le bord de la colonne et son texte (2 fois le corps du texte)
marge_px = 60              # marge autour du texte : bords du mur, portes, titre
creux = 1.0                # part des grains éteints dans la colonne (1 = coupure nette)
creux_bord_px = 15         # le bord de la coupure, en fondu
fond = 0.07               # lumière du panneau de la colonne (0 = simple coupure noire)
portee_px = 150            # distance d'où la matière est aspirée dans la colonne (puis y revient)
condensation = 0.25        # vitesse de cette aspiration

# ---------------------------------------------------------------------------
# Les capteurs (étape 4) : le programme capteurs.py, séparé du moteur. Se recharge à chaud,
# sauf la liste des caméras (relancer capteurs.py).
[capteurs]
osc_vers = ["127.0.0.1:7000"]  # où envoyer les chiffres : kikina.py (127.0.0.1 = cette machine), plus la machine d'Arthur, ex. "192.168.1.20:9000". Relancer après un changement.
seuil = 10                 # écart de gris (0 à 255) pour qu'un point compte ; monter si l'image vide fourmille de bleu
presence_pleine = 0.10     # part de la zone qui diffère du fond (salle vide) pour une présence de 1
energie_pleine = 0.03      # part de la zone qui change d'une image à l'autre pour un mouvement de 1
ips = 30                   # cadence demandée à la caméra (elle sait aller à 120, mais l'image clignote sous un éclairage secteur)
exposition_figee = true    # la caméra règle sa luminosité pendant les 5 s avant le fond, puis n'y touche plus (touche F : recommencer)
pas_seuil = 0.15           # atelier Accueil : part d'une bande qui doit différer du fond pour dire "un pied est dessus"
pas_vide_s = 1.5           # bandes vides depuis ce temps : prêt pour la personne suivante
fond_delai_s = 10          # temps laissé pour sortir du champ avant la photo du fond (au lancement et après la touche F)
fond_s = 120               # le fond suit lentement l'image (lumière qui dérive). 0 = fond fixe. Touche F : le reprendre

# Une caméra : une partie de son nom, et ses zones. Une zone = un rectangle dans l'image de la
# caméra [gauche, haut, droite, bas], de 0 à 1. Test au bureau : moitié gauche = zone 1, moitié droite = zone 2.
[[capteurs.camera]]
nom = "HD USB Camera"
retournee = false          # true si la caméra est fixée tête en bas : l'image est remise à l'endroit (se relit à chaud)
zones = { 1 = [0.0, 0.0, 0.5, 1.0], 2 = [0.5, 0.0, 1.0, 1.0] }
# Atelier Accueil : les bandes au sol, dans l'ordre où le visiteur les franchit (mêmes rectangles de 0 à 1).
# Elles doivent se toucher, et la caméra doit voir le visiteur venir vers elle : la bande 1 est la plus haute dans l'image.
# Bureau de Jérémie (30/09, caméra en hauteur et à l'endroit) : de la porte du fond vers la caméra.
pas = [[0.45, 0.59, 0.63, 0.65], [0.42, 0.65, 0.66, 0.72], [0.39, 0.72, 0.69, 0.83]]

# Deuxième caméra (même nom : la 1re du fichier prend la 1re branchée). Enlever les # pour l'activer, puis relancer.
# [[capteurs.camera]]
# nom = "HD USB Camera"
# zones = { 3 = [0.0, 0.0, 0.5, 1.0], 4 = [0.5, 0.0, 1.0, 1.0] }
